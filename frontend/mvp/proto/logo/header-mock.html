<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CodeLiter — header lockup</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Public Sans",sans-serif; background:#fafafa; color:#18181b; }
  .demo { padding:44px 40px; border-bottom:1px solid #e4e4e7; }
  .demo.dark { background:#111114; color:#f4f4f5; }
  .demo-label { margin-bottom:20px; color:#77777e; font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
  .demo.dark .demo-label { color:#b2b2ba; }
  .header-inner { display:flex; align-items:center; justify-content:space-between; width:min(1184px,100%); margin-inline:auto; height:56px; }
  .wordmark { display:inline-flex; align-items:center; gap:9px; padding-right:23px; position:relative; text-decoration:none; color:inherit; }
  .wordmark::after { position:absolute; top:50%; right:0; width:1px; height:24px; background:#e4e4e7; content:""; transform:translateY(-50%); }
  .demo.dark .wordmark::after { background:#303037; }
  .wordmark-symbol { display:block; width:32px; height:32px; flex:0 0 32px; }
  .wordmark-name { display:inline-flex; align-items:baseline; font-size:17px; line-height:1; }
  .wordmark-code { font-family:"Space Grotesk",sans-serif; font-weight:600; letter-spacing:-.03em; }
  .wordmark-liter { font-family:"Libre Bodoni","Noto Serif SC",Georgia,serif; font-weight:600; letter-spacing:-.005em; }
  .wordmark-dot { color:#ec4899; }
  .nav { display:flex; gap:12px; }
  .nav a { display:grid; place-items:center; width:46px; height:56px; color:#71717a; }
  .demo.dark .nav a { color:#b2b2ba; }
  .nav a.active { color:#ec4899; }
  .actions { display:flex; align-items:center; gap:12px; padding-left:23px; position:relative; }
  .actions::before { content:""; position:absolute; left:0; top:50%; width:1px; height:24px; background:#e4e4e7; transform:translateY(-50%); }
  .demo.dark .actions::before { background:#303037; }
  .search { display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 10px; border:1px solid transparent; border-radius:5px; font-size:12px; color:#52525b; }
  .demo.dark .search { color:#dedee2; }
  .search kbd { border:1px solid #e4e4e7; border-radius:3px; padding:2px 5px; font-size:10px; color:#71717a; background:#f8f8f8; font-family:inherit; }
  .demo.dark .search kbd { border-color:#3d3d45; background:#25252b; color:#c4c4ca; }
  .sizes { display:flex; align-items:flex-end; gap:36px; }
  .size { display:flex; flex-direction:column; align-items:center; gap:10px; color:#77777e; font-size:10px; letter-spacing:.08em; }
  .favicon { display:inline-grid; place-items:center; background:#18181b; }
  .favicon svg { display:block; }
  .wordmark-lg { display:inline-flex; align-items:center; gap:14px; }
  .wordmark-lg .wordmark-name { font-size:34px; }
  .wordmark-lg .wordmark-symbol { width:52px; height:52px; flex-basis:52px; }
</style>
</head>
<body>
  <section class="demo">
    <div class="demo-label">Header · light · 1184px</div>
    <div class="header-inner">
      <a class="wordmark" href="#">
        <svg class="wordmark-symbol" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/>
        </svg>
        <span class="wordmark-name"><span class="wordmark-code">Code</span><span class="wordmark-liter">Liter</span></span>
      </a>
      <nav class="nav">
        <a class="active" href="#">◇</a><a href="#">◇</a><a href="#">◇</a><a href="#">◇</a>
      </nav>
      <div class="actions">
        <div class="search"><span>⌕</span><span>搜索</span><kbd>⌘ K</kbd></div>
      </div>
    </div>
  </section>

  <section class="demo dark">
    <div class="demo-label">Header · dark</div>
    <div class="header-inner">
      <a class="wordmark" href="#">
        <svg class="wordmark-symbol" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#f4f4f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#f28bbb"/>
        </svg>
        <span class="wordmark-name"><span class="wordmark-code">Code</span><span class="wordmark-liter">Liter</span></span>
      </a>
      <nav class="nav">
        <a class="active" href="#">◇</a><a href="#">◇</a><a href="#">◇</a><a href="#">◇</a>
      </nav>
      <div class="actions">
        <div class="search"><span>⌕</span><span>搜索</span><kbd>⌘ K</kbd></div>
      </div>
    </div>
  </section>

  <section class="demo">
    <div class="demo-label">Mark sizes · 32 / 24 / 16 px</div>
    <div class="sizes">
      <div class="size"><svg width="32" height="32" viewBox="0 0 32 32"><path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/></svg><span>32</span></div>
      <div class="size"><svg width="24" height="24" viewBox="0 0 32 32"><path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/></svg><span>24</span></div>
      <div class="size"><svg width="16" height="16" viewBox="0 0 32 32"><path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/></svg><span>16</span></div>
    </div>
  </section>

  <section class="demo">
    <div class="demo-label">Favicon · 64 / 32 / 16 px</div>
    <div class="sizes">
      <div class="size"><span class="favicon" style="width:64px;height:64px"><svg width="42" height="42" viewBox="0 0 32 32"><path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/></svg></span><span>64</span></div>
      <div class="size"><span class="favicon" style="width:32px;height:32px"><svg width="21" height="21" viewBox="0 0 32 32"><path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/></svg></span><span>32</span></div>
      <div class="size"><span class="favicon" style="width:16px;height:16px"><svg width="11" height="11" viewBox="0 0 32 32"><path d="M24 7.5H13A4.5 4.5 0 0 0 8.5 12v8a4.5 4.5 0 0 0 4.5 4.5h11" fill="none" stroke="#fafafa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.6" y="14.3" width="3.4" height="3.4" fill="#ec4899"/></svg></span><span>16</span></div>
    </div>
  </section>
</body>
</html>
